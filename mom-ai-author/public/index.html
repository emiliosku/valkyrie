<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MoM AI Author</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #12151a; color: #e9e5dc; }
    main { max-width: 760px; margin: 0 auto; padding: 2rem 1rem 4rem; } h1 { font-family: Georgia, serif; margin-bottom: .2rem; } .muted { color: #a6acb8; }
    textarea, input { width: 100%; box-sizing: border-box; background: #1d222b; color: inherit; border: 1px solid #46505e; border-radius: .4rem; padding: .7rem; font: inherit; }
    textarea { min-height: 8rem; } button { background: #b95c30; color: #fff; border: 0; border-radius: .4rem; padding: .65rem 1rem; margin: .35rem .35rem .35rem 0; font: inherit; cursor: pointer; } button.secondary { background: #3b4654; } button:disabled { opacity: .55; cursor: wait; }
    section { margin-top: 1.5rem; padding: 1rem; background: #191e26; border: 1px solid #313946; border-radius: .6rem; } #custom { margin-top: .6rem; } .hidden { display: none; } .rating { display: grid; grid-template-columns: 9rem 1fr; gap: .5rem; align-items: center; margin: .45rem 0; } select { background: #1d222b; color: inherit; border: 1px solid #46505e; border-radius: .3rem; padding: .35rem; } pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #11151b; padding: .8rem; border-radius: .4rem; } a { color: #ffc29e; }
  </style>
</head>
<body><main>
  <h1>MoM AI Author</h1><p class="muted">A local interview-led scenario companion for Valkyrie.</p>
  <section id="idea"><label for="ideaText">Describe the scenario you want to play.</label><textarea id="ideaText" placeholder="A haunted bookshop whose catalog predicts the investigators' deaths."></textarea><label class="muted"><input id="mock" type="checkbox"> Use deterministic mock mode</label><br><button id="start">Start interview</button></section>
  <section id="interview" class="hidden"><p id="question"></p><div id="options"></div><input id="custom" placeholder="Or add your own answer"><button id="answer">Continue</button></section>
  <section id="review" class="hidden"><h2>Story bible</h2><pre id="bible"></pre><p>Rate this draft before generation.</p><div id="ratings"></div><textarea id="feedback" placeholder="Optional targeted feedback"></textarea><button id="approve">Approve and generate</button><button id="revise" class="secondary">Save ratings without generating</button></section>
  <section id="result" class="hidden"><h2>Scenario ready</h2><p id="resultText"></p><a id="download">Download .valkyrie</a><pre id="warnings"></pre></section>
  <p id="status" class="muted">Ready.</p>
</main><script src="/app.js"></script></body></html>
